<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - News of Democracy</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Noto Sans Bengali', Arial, sans-serif;
    background: #f0f2f5;
    padding: 15px;
    color: #222;
  }
  .admin-header {
    background: #c0392b;
    color: #fff;
    padding: 15px;
    border-radius: 8px;
    margin-bottom: 20px;
    text-align: center;
  }
  .admin-header h1 { font-size: 22px; }
  .admin-header p { font-size: 13px; margin-top: 4px; }

  .form-box {
    background: #fff;
    padding: 18px;
    border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    margin-bottom: 18px;
  }
  .form-box h2 {
    color: #c0392b;
    font-size: 18px;
    margin-bottom: 14px;
    border-bottom: 2px solid #eee;
    padding-bottom: 8px;
  }
  label {
    display: block;
    font-size: 14px;
    color: #333;
    margin-bottom: 5px;
    margin-top: 10px;
    font-weight: bold;
  }
  input, textarea, select {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-size: 15px;
    font-family: inherit;
    background: #fafafa;
  }
  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: #c0392b;
    background: #fff;
  }
  textarea { resize: vertical; min-height: 100px; }
  button {
    background: #c0392b;
    color: #fff;
    border: none;
    padding: 12px 20px;
    border-radius: 5px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    width: 100%;
    margin-top: 15px;
  }
  button:hover { background: #a93226; }
  button:disabled { background: #999; cursor: not-allowed; }
  .msg {
    margin-top: 12px;
    padding: 10px;
    border-radius: 5px;
    font-size: 14px;
    display: none;
  }
  .msg.success { background: #d4edda; color: #155724; display: block; }
  .msg.error { background: #f8d7da; color: #721c24; display: block; }

  .news-list {
    background: #fff;
    padding: 18px;
    border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  }
  .news-list h2 {
    color: #c0392b;
    font-size: 18px;
    margin-bottom: 14px;
    border-bottom: 2px solid #eee;
    padding-bottom: 8px;
  }
  .news-item {
    border-bottom: 1px solid #eee;
    padding: 10px 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }
  .news-item:last-child { border: none; }
  .news-item-info h3 {
    color: #333;
    font-size: 15px;
    margin-bottom: 3px;
  }
  .news-item-info p {
    font-size: 12px;
    color: #888;
  }
  .delete-btn {
    background: #e74c3c;
    color: #fff;
    border: none;
    padding: 6px 12px;
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
    width: auto;
    margin: 0;
  }
  .delete-btn:hover { background: #c0392b; }
  .loading { text-align: center; color: #888; padding: 15px; }
</style>
</head>
<body>

  <div class="admin-header">
    <h1>📰 Admin Panel</h1>
    <p>News of Democracy - সংবাদ প্রকাশ করুন</p>
  </div>

  <div class="form-box">
    <h2>✍️ নতুন সংবাদ যোগ করুন</h2>
    <form id="newsForm">
      <label>সংবাদের শিরোনাম *</label>
      <input type="text" id="title" required placeholder="যেমন: নরসিংদীতে নতুন সড়ক নির্মাণ শুরু">

      <label>বিভাগ *</label>
      <select id="category" required>
        <option value="">-- বিভাগ বেছে নিন --</option>
        <option value="নরসিংদী">নরসিংদী</option>
        <option value="সদর">সদর</option>
        <option value="রায়পুরা">রায়পুরা</option>
        <option value="পলাশ">পলাশ</option>
        <option value="শিবপুর">শিবপুর</option>
        <option value="মনোহরদী">মনোহরদী</option>
        <option value="বেলাবো">বেলাবো</option>
        <option value="রাজনীতি">রাজনীতি</option>
        <option value="অপরাধ">অপরাধ</option>
        <option value="শিক্ষা">শিক্ষা</option>
        <option value="ক্রীড়া">ক্রীড়া</option>
        <option value="বিনোদন">বিনোদন</option>
      </select>

      <label>সংবাদের বিস্তারিত *</label>
      <textarea id="body" required placeholder="এখানে সংবাদের পূর্ণ বিবরণ লিখুন..."></textarea>

      <label>ছবির নাম (ঐচ্ছিক)</label>
      <input type="text" id="image" placeholder="যেমন: sadar.jpg (GitHub-এ আপলোড করা ছবি)">

      <button type="submit" id="submitBtn">📤 প্রকাশ করুন</button>
      <div class="msg" id="msg"></div>
    </form>
  </div>

  <div class="news-list">
    <h2>📋 প্রকাশিত সংবাদসমূহ</h2>
    <div id="newsList"><div class="loading">লোড হচ্ছে...</div></div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>

  <script>
    const form = document.getElementById('newsForm');
    const msg = document.getElementById('msg');
    const submitBtn = document.getElementById('submitBtn');
    const newsList = document.getElementById('newsList');

    // নতুন সংবাদ যোগ করা
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = 'প্রকাশ হচ্ছে...';

      const title = document.getElementById('title').value.trim();
      const category = document.getElementById('category').value;
      const body = document.getElementById('body').value.trim();
      const image = document.getElementById('image').value.trim();

      try {
        await db.collection('news').add({
          title: title,
          category: category,
          body: body,
          image: image,
          date: new Date().toLocaleDateString('bn-BD', {
            day: 'numeric', month: 'long', year: 'numeric'
          }),
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });

        msg.className = 'msg success';
        msg.textContent = '✅ সংবাদ সফলভাবে প্রকাশিত হয়েছে!';
        form.reset();
        loadNews();
      } catch (err) {
        msg.className = 'msg error';
        msg.textContent = '❌ সমস্যা: ' + err.message;
      }

      submitBtn.disabled = false;
      submitBtn.textContent = '📤 প্রকাশ করুন';
    });

    // সংবাদের তালিকা লোড করা
    async function loadNews() {
      newsList.innerHTML = '<div class="loading">লোড হচ্ছে...</div>';
      try {
        const snapshot = await db.collection('news')
          .orderBy('timestamp', 'desc')
          .limit(20)
          .get();

        if (snapshot.empty) {
          newsList.innerHTML = '<div class="loading">এখনো কোনো সংবাদ নেই।</div>';
          return;
        }

        newsList.innerHTML = '';
        snapshot.forEach((doc) => {
          const data = doc.data();
          const item = document.createElement('div');
          item.className = 'news-item';
          item.innerHTML = `
            <div class="news-item-info">
              <h3>${data.title}</h3>
              <p>${data.category} | ${data.date || ''}</p>
            </div>
            <button class="delete-btn" onclick="deleteNews('${doc.id}')">🗑 মুছুন</button>
          `;
          newsList.appendChild(item);
        });
      } catch (err) {
        newsList.innerHTML = '<div class="loading">লোড করা যায়নি: ' + err.message + '</div>';
      }
    }

    // সংবাদ মুছে ফেলা
    async function deleteNews(id) {
      if (!confirm('আপনি কি এই সংবাদটি মুছে ফেলতে চান?')) return;
      try {
        await db.collection('news').doc(id).delete();
        loadNews();
      } catch (err) {
        alert('মুছতে সমস্যা: ' + err.message);
      }
    }

    loadNews();
  </script>
</body>
  </html>
