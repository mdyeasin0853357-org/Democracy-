<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - News of Democracy</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        .header { background-color: #d9534f; color: white; text-align: center; padding: 15px; border-radius: 8px 8px 0 0; margin: -20px -20px 20px -20px; }
        .header h1 { margin: 0; font-size: 20px; }
        .header p { margin: 5px 0 0 0; font-size: 12px; }
        label { display: block; margin-top: 10px; font-weight: bold; color: #555; }
        input, select, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: inherit; }
        button { width: 100%; padding: 12px; margin-top: 20px; background-color: #d9534f; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #c9302c; }
        .msg { text-align: center; margin-top: 15px; font-weight: bold; padding: 10px; border-radius: 4px; display: none; }
        .msg.success { display: block; background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .msg.error { display: block; background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .news-list { margin-top: 30px; }
        .news-list h2 { font-size: 18px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .news-item { background: #f9f9f9; padding: 15px; margin-bottom: 10px; border-left: 4px solid #d9534f; border-radius: 4px; }
        .news-item h3 { margin: 0 0 5px 0; font-size: 16px; }
        .news-item p { margin: 0; font-size: 14px; color: #666; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📰 Admin Panel</h1>
        <p>News of Democracy - সংবাদ প্রকাশ করুন</p>
    </div>

    <form id="newsForm">
        <label>সংবাদের শিরোনাম *</label>
        <input type="text" id="title" required placeholder="সংবাদের শিরোনাম লিখুন">

        <label>বিভাগ *</label>
        <select id="category" required>
            <option value="নরসিংদী">নরসিংদী</option>
            <option value="রায়পুরা">রায়পুরা</option>
            <option value="পলাশ">পলাশ</option>
            <option value="শিবপুর">শিবপুর</option>
            <option value="বেলাবো">বেলাবো</option>
            <option value="মনোহরদী">মনোহরদী</option>
        </select>

        <label>সংবাদের বিস্তারিত *</label>
        <textarea id="body" rows="5" required placeholder="বিস্তারিত লিখুন"></textarea>

        <label>ছবির নাম (ঐচ্ছিক)</label>
        <input type="text" id="image" placeholder="যেমন: Sadar.jpg (GitHub-এ আপলোড করা ছবি)">

        <button type="submit" id="submitBtn">📤 প্রকাশ করুন</button>
        <div class="msg" id="msg"></div>
    </form>

    <div class="news-list">
        <h2>📋 প্রকাশিত সংবাদসমূহ</h2>
        <div id="newsList"><div style="text-align:center; padding: 20px;">লোড হচ্ছে...</div></div>
    </div>
</div>

<!-- Firebase SDK (Compatible Version) -->
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>

<script>
    // Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyBJjQKi-kaO-ib7pxVj5fTM5VWgzC2NL_A",
        authDomain: "democracy-news-e5857.firebaseapp.com",
        databaseURL: "https://democracy-news-e5857-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "democracy-news-e5857",
        storageBucket: "democracy-news-e5857.firebasestorage.app",
        messagingSenderId: "69601903557",
        appId: "1:69601903557:web:10fc18932abb3b86c181ac",
        measurementId: "G-J7ZP49V7J5"
    };

    // Initialize Firebase
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // DOM Elements
    const form = document.getElementById('newsForm');
    const msg = document.getElementById('msg');
    const submitBtn = document.getElementById('submitBtn');
    const newsList = document.getElementById('newsList');

    // Form Submit (Publish News)
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        submitBtn.disabled = true;
        submitBtn.textContent = 'প্রকাশ হচ্ছে...';
        msg.className = 'msg';
        msg.style.display = 'none';

        const title = document.getElementById('title').value;
        const category = document.getElementById('category').value;
        const body = document.getElementById('body').value;
        const image = document.getElementById('image').value;

        try {
            await db.ref('news').push({
                title: title,
                category: category,
                body: body,
                image: image,
                date: new Date().toLocaleString("bn-BD"),
                timestamp: firebase.database.ServerValue.TIMESTAMP
            });

            msg.className = 'msg success';
            msg.textContent = '✅ সংবাদ সফলভাবে প্রকাশিত হয়েছে!';
            form.reset();
            
        } catch (err) {
            msg.className = 'msg error';
            msg.textContent = '❌ সমস্যা: ' + err.message;
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = '📤 প্রকাশ করুন';
        }
    });

    // Load News Function (Realtime Database)
    function loadNews() {
        db.ref('news').on('value', (snapshot) => {
            newsList.innerHTML = '';
            if (snapshot.exists()) {
                // ডাটা উল্টো করে দেখাবে (নতুনটা আগে)
                const newsData = [];
                snapshot.forEach((childSnapshot) => {
                    newsData.push({ id: childSnapshot.key, ...childSnapshot.val() });
                });
                newsData.reverse();

                newsData.forEach((news) => {
                    const div = document.createElement('div');
                    div.className = 'news-item';
                    div.innerHTML = `
                        <h3>${news.title}</h3>
                        <p><strong>বিভাগ:</strong> ${news.category} | <strong>তারিখ:</strong> ${news.date}</p>
                        <p>${news.body.substring(0, 50)}...</p>
                    `;
                    newsList.appendChild(div);
                });
            } else {
                newsList.innerHTML = '<div style="text-align:center; padding: 20px;">এখনো কোনো সংবাদ নেই।</div>';
            }
        }, (error) => {
            newsList.innerHTML = `<div style="text-align:center; padding: 20px; color:red;">এরর: ${error.message}</div>`;
        });
    }

    // Call loadNews when page loads
    loadNews();

</script>
</body>
</html>
